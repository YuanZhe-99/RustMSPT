[package]
name = "rustmspt"
version = "0.1.0"
edition = "2021"
description = "Rust Microstructure Processing Toolbox"
license = "MIT"

[lib]
name = "rustmspt"
path = "src/lib.rs"

[[bin]]
name = "rustmspt"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
thiserror = "2"
parry3d-f64 = "0.19"
indicatif = "0.17"
rayon = "1.10"
rustfft = "6.2"
tiff = "0.10"
nalgebra = "0.33"

[dev-dependencies]
tempfile = "3"