[package]
name = "rustmspt"
version = "0.2.1"
edition = "2021"
build = "build.rs"
description = "Rust Microstructure Processing Toolbox"
license = "MIT"

[lib]
name = "rustmspt"
path = "src/lib.rs"

[[bin]]
name = "rustmspt"
path = "src/main.rs"

[[bin]]
name = "precision_test"
path = "src/bin/precision_test.rs"

[features]
default = []
gpu = ["dep:wgpu", "dep:pollster", "dep:bytemuck"]

[dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
csv = "1.3"
rand = { version = "0.8", features = ["small_rng"] }
rand_chacha = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
thiserror = "2"
parry3d-f64 = "0.19"
robust = "1.2"
smallvec = "1.15"
spade = "=2.15.1"
indicatif = "0.17"
rayon = "1.10"
rustfft = "6.2"
tiff = "0.10"
nalgebra = "0.33"
image = { version = "0.25", default-features = false, features = ["png"] }
wgpu = { version = "24", optional = true }
pollster = { version = "0.4", optional = true }
bytemuck = { version = "1", features = ["derive"], optional = true }

[dev-dependencies]
tempfile = "3"
