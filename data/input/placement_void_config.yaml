# Placement around a frozen void.
#
# The void is never filled, moved or cleaned. It is copied byte for byte beside
# the outputs, and the report records its digest before and after, so the freeze
# is something a reader can check rather than take on trust.
#
# Every relative path below resolves against the directory holding THIS file.
placement:
  # Optional new fill task from a verified flat particle assembly.
  # Use separate outputs; inherited gap may be smaller inside old clusters.
  # initial_particles: {record: "previous/particles.json", report: "previous/run_report.json", existing_gap: 0.1}
  # Optional original-plan transfer for a NEW fill task:
  # initial_particles: {record: "previous/particles.json", report: "previous/run_report.json",
  #                     existing_gap: 0.1, pending_checkpoint: "previous/checkpoint.json",
  #                     retry_failed: true}
  initial_particles: null
  # Exact individual gap fill (disable aggregates for this mode):
  # position:
  #   mode: free_space_guided
  #   free_space: {coarse_cell_size: 8, min_cell_size: 1, max_cells: 250000,
  #                index_memory_mb: 128, candidates_per_location: 8,
  #                exploration_fraction: 0.10, local_refinement: true}
  seed: 20260910

  frame:
    unit: "um"

  domain:
    min: [0, 0, 0]
    max: [100, 100, 100]

  shapes:
    files: ["particles.stl"]
    filters:
      max_aspect_ratio: 3.0

  void:
    # Three spherical pores. Regenerate with:
    #   python3 data/fixtures/placement/make_void.py data/input/placement/void_spheres.stl
    file: "placement/void_spheres.stl"
    # `forbidden`: the whole particle keeps `gap` from the void surface.
    # `allowed`: a particle may reach in, and the overlap is measured and owned
    # by the void, which then needs overlap_volume.voxel_size.
    crossing: forbidden
    # g_pv. Must be greater than zero when crossing is forbidden: two shapes
    # that intersect report distance 0.0, so a zero gap forbids nothing.
    gap: 2.0

  size:
    distribution:
      kind: lognormal
      median: 10.0
      sigma_log: 0.3
      min: 5.0
      max: 20.0
    classes: { kind: equal_width, count: 5 }

  orientation: { mode: uniform_so3 }
  gaps: { particle_particle: 1.0 }

  target:
    volume_fraction: 0.12
    # The domain minus the void, which is what a solid-phase fraction is
    # normally quoted against.
    basis: solid

  budget:
    attempts_per_particle: 3000
    total_attempts: 2000000

  outputs:
    dir: "../output/placement_void"
    # Uncomment to also write the three-phase label field and per-voxel ids.
    # voxel_labels: { voxel_size: 1.0 }

  # Optional aggregate engine. False (or omitted) keeps individual placement.
  # For enabled examples see placement_aggregate_config.yaml / placement_mixed_config.yaml.
  aggregates:
    # Mixed fallback tests real members and can enter empty proxy space.
    exact_fallback: false
    enabled: false
    construction: fcc           # Set contact_growth for contact-based templates
    contact_directions: 12
    contact_orientations: 4
    contact_tolerance: 0.00001
    contact_max_steps: 96
    contact_orientation: fixed   # fixed (original) or principal (flat faces toward the assembly)
    contact_settle_steps: 0     # Roll toward centre after first contact; 0 disables
    contact_settle_candidates: 3 # Best straight approaches that are settled
    neighborhood_sweeps: 2
    mode: clusters               # clusters or mixed (large then smaller blocks)
    variants: auto               # Or an explicit positive integer, e.g. 8
    particles_per_cluster: 64
    fallback_particles_per_cluster: [16, 4, 1]  # Mixed only, decreasing counts
    shape: sphere                # sphere or cube
    internal_gap: 0.1
    compaction_sweeps: 32        # FCC only
    mesh_refinement_sweeps: 8    # FCC only
    target_internal_volume_fraction: 0.50  # True member volume / container volume
    strategy_rounds: 8
    max_compaction_trials: 6000   # Per-template trials; contact growth includes insertion
    rotation_search: true
    lateral_rearrangement: true
    pair_rearrangement: true
    container_shrink_fraction: 0.03 # FCC only
    rotation_step_degrees: 15

  # Exact geometry is reconstructed from shared f64 source shells on cache misses.
  memory:
    geometry_cache_mb: 256        # Estimated retained geometry; 0 disables caching
    simplified_collision: false  # Optional conservative 12-triangle box screen

  # Save periodically, on interruption and also after target attainment.
  checkpoint:
    enabled: true
    interval_seconds: 60          # 0 disables the time trigger
    every_particles: 1000         # 0 disables the count trigger
    resume_from: null            # e.g. ../output/placement/checkpoint.json
    extend: false                # true + higher target appends to a completed run
