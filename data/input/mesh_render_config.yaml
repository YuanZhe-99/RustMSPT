# Configuration for the mesh-render subcommand (VTU volume-mesh renderer).
# See docs/en-us/examples/mesh-render.md for a walkthrough of every field.
mesh_render:
  input: data/output/mesh.vtu
  output_dir: data/output/mesh_render
  # Named presets (front/back/left/right/top/bottom/iso_ne/iso_nw/iso_se/iso_sw)
  # and/or custom camera blocks: {name, view_direction, focus_point?, up_vector?}.
  views: [iso_ne, front, top]
  width: 1024
  height: 1024
  # RGB or RGBA; alpha 0 renders a transparent PNG background.
  background: [255, 255, 255, 255]
  ambient: 0.25
  # "uniform", a cell-array name, or a point-array name (separation_t, sizing_h);
  # integer arrays -> categorical palette, float arrays -> sequential (viridis)
  # colormap. A point array colours each cell by the mean of its point values.
  color_by: region_key
  # cpu (default, exact transparency), gpu (opaque preview, errors if unavailable),
  # or auto (GPU when present, silently falling back to CPU).
  backend: cpu
  volume_opacity: 1.0
  face_opacity: 1.0
  # region_key (integer, as string) -> opacity, e.g. make background see-through:
  # opacity_overrides: { "0": 0.15 }
  show_faces: true
  show_curves: true
  wireframe: false
  # AND-composed filters; each entry is kind-tagged, e.g.:
  #   - { kind: region_key, values: [1, 2] }
  #   - { kind: background, keep: false }
  #   - { kind: clip_plane, origin: [0.5, 0.5, 0.5], normal: [0, 0, 1] }
  #   - { kind: array_range, array: aspect_ratio, min: 10.0, max: 1.0e30 }
  filters: []
  # World-space points marked with an always-on-top cross (e.g. from mesh-verify JSON).
  highlight_points: []
  projection: orthographic
  perspective_fov_degrees: 45.0
  fit_padding: 0.05
