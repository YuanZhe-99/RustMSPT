# optimization_config.yaml

# Input source
input:
  stl_path: "data/output/packed_result.stl" # Or single STL

# Target definition
target:
  # Type: 'manual_array' or 'reference_stl'
  type: 'manual_array' 
  
  # If type is 'manual_array', provide 11 floats (r=0 to 10)
  # Example: [0.3, 0.25, 0.15, 0.12, 0.10, 0.09, 0.09, 0.09, 0.09, 0.09, 0.09]
  s2_array: [0.063074, 0.051980, 0.041610, 0.034790, 0.027570, 0.022830, 0.017730, 0.014000, 0.010800, 0.008240, 0.006440]
  # If type is 'reference_stl', provide path
  stl_path: "data/input/particles.stl"
  stl_bounding_box: [] # Optional: [min_x, min_y, min_z, max_x, max_y, max_z]

# Box dimensions
box:
  dimensions: [50.0, 50.0, 50.0]

# Optimization parameters
optimization:
  max_iterations: 5_000

  # --- Simulated Annealing (SA) temperature schedule ---
  # initial_temperature:
  #   Starting SA temperature. Higher = more exploration (accept worse moves more often).
  # cooling_rate:
  #   Base per-iteration decay factor (< 1.0). Closer to 1.0 = slower cooling.
  # adaptive_temp_window:
  #   Number of iterations in one acceptance-rate window.
  # target_acceptance_low/high:
  #   Desired acceptance-rate band. If actual acceptance is below low => heat up.
  #   If above high => cool down faster.
  # adaptive_heat_factor:
  #   Multiplier applied when acceptance is too low (should be > 1.0).
  # adaptive_cool_factor:
  #   Multiplier applied when acceptance is too high (should be < 1.0).
  # adaptive_temp_ceiling_factor:
  #   Max allowed temperature = initial_temperature * this factor.

  # Recommended profile A (exploration-first):
  # initial_temperature: 0.15
  # cooling_rate: 0.992
  # adaptive_temp_window: 80
  # target_acceptance_low: 0.25
  # target_acceptance_high: 0.55
  # adaptive_heat_factor: 1.12
  # adaptive_cool_factor: 0.97
  # adaptive_temp_ceiling_factor: 8.0

  # Recommended profile B (convergence-first):
  # initial_temperature: 0.08
  # cooling_rate: 0.988
  # adaptive_temp_window: 40
  # target_acceptance_low: 0.15
  # target_acceptance_high: 0.35
  # adaptive_heat_factor: 1.05
  # adaptive_cool_factor: 0.90
  # adaptive_temp_ceiling_factor: 3.0

  initial_temperature: 0.1
  cooling_rate: 0.99
  adaptive_temp_window: 50
  target_acceptance_low: 0.20
  target_acceptance_high: 0.45
  adaptive_heat_factor: 1.08
  adaptive_cool_factor: 0.94
  adaptive_temp_ceiling_factor: 5.0
  
  # 2PCF Calculation settings
  r_max: 10
  voxel_pitch: 1.0 # Larger pitch = faster but less accurate
  mc_method: 'monte_carlo' # 'monte_carlo' or 'exact'
  mc_samples: 8_000 # Samples for Monte Carlo estimation
  
  # Perturbation limits
  max_translation: 25.0
  max_rotation_deg: 30.0

  # Rotation constraint for particle perturbation
  # Options: 'none', 'x', 'y', 'z', 'vector', 'any'
  # 'vector' uses rotation_axis_vector as axis direction and rotates around particle centroid.
  rotation_mode: 'none'
  rotation_axis_vector: [0.0, 0.0, 1.0]

  # Min neighbor distance
  min_neighbor_distance: 1.0

  # Mode 1: Strict, Mode 2: Loose, Mode 3: Periodic
  mode: 2 
  
  # d_1: Minimum distance for fully internal particles
  min_boundary_dist: 1.5
  
  # d_2: Minimum protrusion/retention depth for crossing particles
  min_cross_boundary_depth: 3.0

  # Pre-optimization selective pruning stage
  # This stage removes particles to bring VF close to target_s2[0] before annealing.
  prune_enabled: true
  prune_tolerance: 0.01
  prune_max_rounds: 120
  prune_eval_samples: 1000

  # CPU worker limit for optimization and S2 computation
  # -1 means no limit (use all available cores)
  cpu_max: -1

  # Orientation fix before final output (can be expensive)
  # false by default to skip; set true to enforce positive signed volume orientation.
  orient_to_positive_volume: false
  
output:
  path: "data/output/optimized_structure.stl"